<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MC bridge logo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Line 1: MC -->
  <text x="256" y="220"
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="150"
        font-weight="700"
        letter-spacing="-6"
        fill="#fff">MC</text>

  <!-- Line 2: camera — node — hub (smaller) -->
  <g transform="translate(0 268)">
    <!-- camera -->
    <rect x="118" y="18" width="70" height="16" rx="6" fill="#fff"/>
    <path d="M118 34h70c0 30-16 54-35 54S118 64 118 34Z" fill="#fff"/>
    <circle cx="153" cy="54" r="11" fill="#1d4ed8"/>
    <circle cx="153" cy="54" r="4.5" fill="#93c5fd"/>

    <!-- link + nodes -->
    <circle cx="214" cy="56" r="9" fill="#fff"/>
    <rect x="214" y="50" width="84" height="12" rx="6" fill="#fff"/>
    <circle cx="298" cy="56" r="9" fill="#93c5fd"/>

    <!-- hub -->
    <rect x="322" y="20" width="58" height="76" rx="12" fill="#fff"/>
    <rect x="336" y="38" width="30" height="6" rx="3" fill="#1d4ed8"/>
    <rect x="336" y="54" width="30" height="6" rx="3" fill="#1d4ed8"/>
    <rect x="336" y="70" width="20" height="6" rx="3" fill="#93c5fd"/>
  </g>
</svg>
